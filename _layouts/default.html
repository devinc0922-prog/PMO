<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@87,600;87,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
<header class="masthead">
  <a class="brand" href="{{ '/' | relative_url }}">PMO</a>
  <nav>
    <a href="{{ '/intake/' | relative_url }}">Project intake</a>
    <a href="{{ '/intake/#submissions' | relative_url }}">Intake queue</a>
    <a href="{{ '/team/' | relative_url }}" {% if page.url contains '/team/' %}aria-current="page"{% endif %}>Team</a>
  </nav>
</header>
<hr class="rule">
<main class="page">
{{ content }}
</main>
<footer class="foot">Professional Services · Intake → Charter → Plan → Estimate → ConnectWise</footer>
</body>
</html>
