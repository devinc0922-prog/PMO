# Publishes firestore.rules to Firebase whenever it changes on main.
# Uses the FIREBASE_SERVICE_ACCOUNT repository secret: a service account limited to
# Firebase Rules Admin + Service Usage Consumer. It can change rules; it can't read intake data.
name: Deploy Firestore rules

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - .github/workflows/deploy-firestore-rules.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT: project-management-offic-a2dfb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write service account key
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_KEY" ]; then echo "::error::The FIREBASE_SERVICE_ACCOUNT secret is missing or empty."; exit 1; fi
          printf '%s' "$SA_KEY" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Deploy rules
        run: npx --yes firebase-tools@13.35.1 deploy --only firestore:rules --project "$FIREBASE_PROJECT" --non-interactive

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
